<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lost in the dark | Firedreams Studio</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
    font-family: "Inter", system-ui, sans-serif;
    color: #f4f4f6;
    background:
      linear-gradient(rgba(8, 5, 10, 0.9), rgba(8, 5, 10, 0.94)),
      url("/images/bg/garden_afternoon.webp") center / cover no-repeat #0a0a0c;
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4rem);
    color: #fff4d4;
    margin: 0 0 12px;
  }
  p { color: #c8c8d0; margin: 0 0 32px; }
  a {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 2px;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    color: #f4f4f6;
    background: #ff2d7a;
    box-shadow: 0 8px 32px rgba(255, 45, 122, 0.45);
    transition: transform 0.2s ease, background 0.25s;
  }
  a:hover { background: #ff5fa0; transform: translateY(-2px); }
</style>
</head>
<body>
<main>
  <h1>Lost in the dark</h1>
  <p>This page wandered off into the caves. The way home is right here.</p>
  <a href="/">Back to Firedreams Studio</a>
</main>
</body>
</html>
